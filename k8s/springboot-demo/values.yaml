replicaCount: 2

image:
  repository: yangchun3728/yc
  pullPolicy: Always
  tag: "99e0cc17d494e479d07cd45c41a39a0fbd8e8daa"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi