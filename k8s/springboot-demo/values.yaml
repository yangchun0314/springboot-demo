replicaCount: 2

image:
  repository: yangchun3728/yc
  pullPolicy: Always
  tag: "51dcea7f45a164aa89af0ba2bb75712c815f4aec"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi