replicaCount: 2

image:
  repository: yangchun3728/yc
  pullPolicy: Always
  tag: "7c700f42ef15c0a74b35ae62cfe4ce0a75527c4d"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi