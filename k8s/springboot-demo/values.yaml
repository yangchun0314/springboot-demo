replicaCount: 5

image:
  repository: yangchun3728/yc
  pullPolicy: Always
  tag: "b0e81bb45abfda98e1873f29b99690a7f047f56e"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi