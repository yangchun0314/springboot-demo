replicaCount: 2

image:
  repository: yangchun3728/yc
  pullPolicy: Always
  tag: "5130c3d2ee5a2aa3496f7b0e8b60cb0d9db295b9"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi