apiVersion: v1
kind: Service
metadata:
  name: {{ include "springboot-demo.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "springboot-demo.selectorLabels" . | nindent 4 }}